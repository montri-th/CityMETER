<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>CityMETER mobile QA</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #15222a;
        background: #dce1dd;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
      }

      header {
        width: min(100%, 760px);
        margin: 0 auto 16px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }

      p {
        margin: 0;
        color: #4e5c63;
        font-size: 14px;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        width: min(100%, 760px);
        margin: 0 auto 20px;
      }

      button,
      a {
        min-height: 44px;
        border: 1px solid #aeb9b4;
        border-radius: 10px;
        padding: 10px 14px;
        color: #15222a;
        background: #f6f7f3;
        font: inherit;
        text-decoration: none;
        cursor: pointer;
      }

      button[aria-pressed="true"] {
        border-color: #1d4497;
        color: #ffffff;
        background: #1d4497;
      }

      main {
        display: grid;
        place-items: start center;
        overflow: auto;
      }

      iframe {
        box-sizing: content-box;
        width: 320px;
        height: 700px;
        border: 1px solid #aeb9b4;
        border-radius: 10px;
        background: #f6f7f3;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>CityMETER mobile QA</h1>
      <p>เลือก viewport แล้วตรวจหน้าเดียวกับ GitHub Pages entry point</p>
    </header>
    <nav aria-label="Mobile viewport controls">
      <button type="button" data-width="320" data-height="700" aria-pressed="true">320 × 700</button>
      <button type="button" data-width="390" data-height="844" aria-pressed="false">390 × 844</button>
      <button type="button" data-width="430" data-height="932" aria-pressed="false">430 × 932</button>
      <button type="button" data-width="720" data-height="900" aria-pressed="false">720 × 900</button>
      <button type="button" data-width="900" data-height="900" aria-pressed="false">900 × 900</button>
      <button type="button" data-width="901" data-height="900" aria-pressed="false">901 × 900</button>
      <button type="button" data-width="1120" data-height="900" aria-pressed="false">1120 × 900</button>
      <button type="button" data-width="1440" data-height="900" aria-pressed="false">1440 × 900</button>
      <a href="./index.html" target="_blank" rel="noopener">เปิดหน้าเต็ม</a>
    </nav>
    <main>
      <iframe src="./index.html?qa=responsive-matrix" title="CityMETER responsive preview"></iframe>
    </main>
    <script>
      const frame = document.querySelector('iframe');
      const buttons = document.querySelectorAll('button[data-width]');

      buttons.forEach((button) => {
        button.addEventListener('click', () => {
          frame.style.width = `${button.dataset.width}px`;
          frame.style.height = `${button.dataset.height}px`;
          buttons.forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
        });
      });
    </script>
  </body>
</html>
